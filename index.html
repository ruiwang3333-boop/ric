const $=id=>document.getElementById(id), cats=['food','transport','shopping','housing','entertainment','health','other'], KEY='jandon-ledger-v1';
let state={version:2,lang:'zh',people:[{id:'default',name:'默认成员',opening:{CNY:0,KRW:0}}],records:[]},mode='expense',editing=null,loadFailed=false,saveFailed=false;
const round=n=>Math.round((n+Number.EPSILON)*100)/100,t=k=>dict[state.lang][k]||k,fmt=n=>Number(n).toLocaleString(state.lang==='zh'?'zh-CN':'ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;let d=new Date(s+'T00:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===s}
function validState(s){return !!(s&&s.version===2&&['zh','ko'].includes(s.lang)&&Array.isArray(s.people)&&s.people.length>0&&s.people.length<=1000&&new Set(s.people.map(p=>p.id)).size===s.people.length&&s.people.every(p=>typeof p.id==='string'&&p.id.length>0&&typeof p.name==='string'&&p.name.trim().length>0&&p.name.length<=40&&p.opening&&['CNY','KRW'].every(c=>Number.isFinite(p.opening[c])&&Math.abs(p.opening[c])<=1e15))&&Array.isArray(s.records)&&s.records.length<=100000&&new Set(s.records.map(r=>r.id)).size===s.records.length&&s.records.every(r=>typeof r.id==='string'&&s.people.some(p=>p.id===r.personId)&&['expense','exchange','recharge'].includes(r.type)&&['CNY','KRW'].includes(r.currency)&&Number.isFinite(r.amount)&&r.amount>0&&r.amount<=1e12&&validDate(r.date)&&typeof r.note==='string'&&r.note.length<=300&&(r.type==='expense'?cats.includes(r.category):r.type==='recharge'||Number.isFinite(r.rate)&&r.rate>=.000001&&r.rate<=1e9&&received(r)>0&&Number.isFinite(received(r)))))}
function migrate(s){if(s&&s.version===1){if(!s.opening||!Array.isArray(s.records))throw Error();return {version:2,lang:s.lang,people:[{id:'default',name:s.lang==='ko'?'기본 사용자':'默认成员',opening:s.opening}],records:s.records.map(r=>({...r,personId:'default'}))}}return s}
function personName(id){return state.people.find(p=>p.id===id)?.name||''}
function received(r){return round(r.currency==='CNY'?r.amount*r.rate:r.amount/r.rate)}
try{let raw=localStorage.getItem(KEY);if(raw){let parsed=migrate(JSON.parse(raw));if(!validState(parsed))throw Error();state=parsed}}catch(e){loadFailed=true}
function persist(){if(loadFailed)return;try{localStorage.setItem(KEY,JSON.stringify(state));saveFailed=false}catch(e){saveFailed=true}renderStatus()}
function totals(personId=$('personScope').value){let b={CNY:0,KRW:0},opening={CNY:0,KRW:0},spent={CNY:0,KRW:0},recharge={CNY:0,KRW:0};for(let p of state.people){if(personId&&p.id!==personId)continue;for(let c of ['CNY','KRW'])opening[c]+=p.opening[c]}b={...opening};for(let r of state.records){if(personId&&r.personId!==personId)continue;if(r.type==='recharge'){b[r.currency]+=r.amount;recharge[r.currency]+=r.amount}else{b[r.currency]-=r.amount;if(r.type==='exchange')b[r.currency==='CNY'?'KRW':'CNY']+=received(r);else spent[r.currency]+=r.amount}}return {b,opening,spent,recharge}}
function renderPeople(){options('personScope',[['',t('allPeople')],...state.people.map(p=>[p.id,p.name])]);options('entryPerson',state.people.map(p=>[p.id,p.name]));let body=$('peopleSummary');body.replaceChildren();for(let p of state.people){let row=body.insertRow(),v=totals(p.id);row.insertCell().textContent=p.name;for(let data of [v.opening,v.recharge,v.spent,v.b]){let cell=row.insertCell();cell.textContent='¥ '+fmt(round(data.CNY))+' / ₩ '+fmt(round(data.KRW));if(data===v.b&&(round(data.CNY)<0||round(data.KRW)<0))cell.style.color='#a23838'}}}
function renderStatus(){let el=$('status'),msg=loadFailed?t('loadError'):saveFailed?t('storageError'):state.people.some(p=>Object.values(totals(p.id).b).some(v=>round(v)<0))?t('negative'):'';el.textContent=msg;el.style.display=msg?'block':'none'}
function options(id,items){let el=$(id),old=el.value;el.replaceChildren(...items.map(([v,text])=>new Option(text,v)));if(items.some(a=>a[0]===old))el.value=old}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'ko';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('language').textContent=state.lang==='zh'?'한국어':'中文';options('category',cats.map(c=>[c,t(c)]));options('filterCategory',[['',t('allCategories')],...cats.map(c=>[c,t(c)])]);options('filterType',[['',t('allTypes')],['expense',t('expense')],['exchange',t('exchange')],['recharge',t('recharge')]]);$('search').placeholder=t('search');renderPeople();let {b,spent,opening,recharge}=totals();for(let c of ['CNY','KRW']){$(c.toLowerCase()+'Balance').textContent=(c==='CNY'?'¥ ':'₩ ')+fmt(round(b[c]));$(c.toLowerCase()+'Details').textContent=`${t('openingShort')} ${fmt(opening[c])} · ${t('recharge')} ${fmt(recharge[c])} · ${t('spent')} ${fmt(spent[c])}`}renderForm();renderRecords();renderStatus();cloudUI()}
function renderForm(){$('formTitle').textContent=t(editing?'edit':'add');$('saveButton').textContent=t(editing?'save':'add');$('cancelEdit').hidden=!editing;$('expenseTab').classList.toggle('active',mode==='expense');$('exchangeTab').classList.toggle('active',mode==='exchange');$('rechargeTab').classList.toggle('active',mode==='recharge');$('expenseFields').hidden=mode==='exchange';$('categoryField').hidden=mode!=='expense';$('exchangeFields').hidden=mode!=='exchange';$('rateField').hidden=mode!=='exchange';$('rate').required=mode==='exchange';$('amountLabel').textContent=t(mode==='exchange'?'outAmount':'amount')+' · '+(mode==='exchange'?$('direction').value:$('currency').value);updateConversion()}
function updateConversion(){let r={currency:$('direction').value,amount:Number($('amount').value),rate:Number($('rate').value)};$('conversion').textContent=r.amount>0&&r.rate>0?`${t('receive')} ${fmt(received(r))} ${r.currency==='CNY'?'KRW':'CNY'}`:'1 CNY = … KRW'}
function filtered(){return state.records.filter(r=>(!$('personScope').value||r.personId===$('personScope').value)&&(!$('filterType').value||r.type===$('filterType').value)&&(!$('filterCurrency').value||r.type==='exchange'||r.currency===$('filterCurrency').value)&&(!$('filterCategory').value||r.type==='expense'&&r.category===$('filterCategory').value)&&(!$('fromDate').value||r.date>=$('fromDate').value)&&(!$('toDate').value||r.date<=$('toDate').value)&&r.note.toLowerCase().includes($('search').value.trim().toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}
function renderRecords(){let list=filtered(),sum={CNY:0,KRW:0};list.forEach(r=>{if(r.type==='expense')sum[r.currency]+=r.amount});$('summary').textContent=($('fromDate').value&&$('toDate').value&&$('fromDate').value>$('toDate').value?t('rangeError')+' ':'')+`${list.length} ${t('count')} · ${t('subtotal')} CNY ${fmt(sum.CNY)} / KRW ${fmt(sum.KRW)}`;let body=$('records');body.replaceChildren();if(!list.length){let row=body.insertRow(),cell=row.insertCell();cell.colSpan=4;cell.className='empty';cell.textContent=t(state.records.length?'noMatch':'empty');return}for(let r of list){let row=body.insertRow();row.insertCell().textContent=r.date;let detail=row.insertCell();detail.textContent=personName(r.personId)+' · '+(r.type==='expense'?t(r.category):t(r.type));let note=document.createElement('small');note.textContent=r.note;detail.append(note);let money=row.insertCell();money.className='money '+(r.type==='recharge'?'positive':'negative');money.textContent=`${r.type==='recharge'?'+':'−'}${fmt(r.amount)} ${r.currency}`;if(r.type==='exchange'){let sub=document.createElement('small');sub.textContent=`+${fmt(received(r))} ${r.currency==='CNY'?'KRW':'CNY'}\n1 CNY = ${r.rate} KRW`;money.append(sub)}let actions=row.insertCell(),box=document.createElement('div');box.className='actions';for(let action of ['edit','delete']){let btn=document.createElement('button');btn.type='button';btn.textContent=t(action+'Action');if(action==='delete')btn.className='danger';btn.onclick=()=>action==='edit'?editRecord(r.id):deleteRecord(r.id);box.append(btn)}actions.append(box)}}
function resetForm(){editing=null;$('entryForm').reset();$('date').value=today();$('entryPerson').value=$('personScope').value||state.people[0].id;renderForm()}
function editRecord(id){let r=state.records.find(x=>x.id===id);editing=id;mode=r.type;$('entryPerson').value=r.personId;$('currency').value=r.currency;$('direction').value=r.currency;$('amount').value=r.amount;$('rate').value=r.rate||'';$('category').value=r.category||cats[0];$('date').value=r.date;$('note').value=r.note;renderForm();$('formTitle').scrollIntoView({behavior:'smooth',block:'center'});$('amount').focus({preventScroll:true})}
function deleteRecord(id){if(confirm(t('deleteConfirm'))){state.records=state.records.filter(r=>r.id!==id);if(editing===id)resetForm();persist();render()}}
$('entryForm').onsubmit=e=>{e.preventDefault();let r={id:editing||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),type:mode,personId:$('entryPerson').value,currency:$(mode==='exchange'?'direction':'currency').value,amount:round(Number($('amount').value)),date:$('date').value,note:$('note').value.trim()};if(mode==='expense')r.category=$('category').value;else if(mode==='exchange')r.rate=Number($('rate').value);if(!validState({...state,records:[r]})){alert(t('invalid'));return}if(editing)state.records=state.records.map(x=>x.id===editing?r:x);else state.records.push(r);persist();resetForm();render()};
for(let m of ['expense','exchange','recharge'])$(m+'Tab').onclick=()=>{resetForm();mode=m;renderForm()};$('personScope').onchange=()=>{if(!editing)$('entryPerson').value=$('personScope').value||state.people[0].id;render()};$('cancelEdit').onclick=resetForm;$('language').onclick=()=>{state.lang=state.lang==='zh'?'ko':'zh';persist();render()};for(let id of ['amount','rate'])$(id).oninput=updateConversion;for(let id of ['currency','direction'])$(id).onchange=renderForm;for(let id of ['filterType','filterCurrency','filterCategory','fromDate','toDate','search'])$(id).oninput=renderRecords;$('resetFilters').onclick=()=>{for(let id of ['personScope','filterType','filterCurrency','filterCategory','fromDate','toDate','search'])$(id).value='';render()};
function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvCell(v){let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
$('exportCSV').onclick=()=>{let rows=[['人员 / 사용자','日期 / 날짜','类型 / 유형','充值·换出·支出金额 / 충전·환전·지출액','币种 / 통화','分类 / 분류','1 CNY = KRW','换入金额 / 입금액','换入币种 / 입금 통화','备注 / 메모']];filtered().forEach(r=>rows.push([personName(r.personId),r.date,t(r.type),r.amount,r.currency,r.type==='expense'?t(r.category):'',r.rate||'',r.type==='exchange'?received(r):'',r.type==='exchange'?(r.currency==='CNY'?'KRW':'CNY'):'',r.note]));download('\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'jandon-'+today()+'.csv','text/csv;charset=utf-8')};
function fillPersonForm(){let p=state.people.find(p=>p.id===$('managePerson').value);$('personName').value=p?.name||'';for(let c of ['CNY','KRW'])$('opening'+c).value=p?.opening[c]||0}
function openPeople(){options('managePerson',state.people.map(p=>[p.id,p.name]));$('managePerson').value=$('personScope').value||state.people[0].id;fillPersonForm();$('openingDialog').showModal()}
$('openingButton').onclick=openPeople;$('managePeople').onclick=openPeople;$('managePerson').onchange=fillPersonForm;$('newPerson').onclick=()=>{options('managePerson',[['',t('newPerson')],...state.people.map(p=>[p.id,p.name])]);$('managePerson').value='';fillPersonForm();$('personName').focus()};$('closeOpening').onclick=()=>$('openingDialog').close();$('openingForm').onsubmit=e=>{e.preventDefault();let id=$('managePerson').value,name=$('personName').value.trim(),opening={CNY:round(Number($('openingCNY').value)),KRW:round(Number($('openingKRW').value))};if(!name||name.length>40||state.people.some(p=>p.id!==id&&p.name.toLocaleLowerCase()===name.toLocaleLowerCase())){alert(t('nameError'));return}if(!Object.values(opening).every(n=>Number.isFinite(n)&&Math.abs(n)<=1e15)){alert(t('invalid'));return}let person={id:id||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),name,opening};let next={...state,people:id?state.people.map(p=>p.id===id?person:p):[...state.people,person]};if(!validState(next)){alert(t('invalid'));return}state=next;persist();render();if(!id){$('personScope').value=person.id;$('entryPerson').value=person.id;render()}$('openingDialog').close()};$('backupButton').onclick=()=>download(JSON.stringify(state,null,2),'jandon-backup-'+today()+'.json','application/json');$('restoreButton').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>50000000)throw Error();let s=migrate(JSON.parse(await file.text()));if(!validState(s))throw Error();if(!confirm(t('restoreConfirm')))return;state=s;loadFailed=false;persist();resetForm();render()}catch(err){alert(t('badBackup'))}finally{e.target.value=''}};
// Only public project configuration is retained. Passwords and access tokens stay in memory.
const CLOUD_CONFIG_KEY='jandon-cloud-config-v1';
const CLOUD_DEFAULT={url:'',key:''};
let cloudSession=null,cloudRevision=null,cloudBusy=false;
function cloudMessage(key,error=false){$('cloudStatus').textContent=t(key);$('cloudStatus').dataset.error=String(error)}
function cloudUI(){
 $('cloudAuth').hidden=!!cloudSession;$('cloudAccount').hidden=!cloudSession;
 $('cloudWho').textContent=cloudSession?.user.email||'';
 $('cloudButton').textContent=t(cloudSession?'cloudConnected':'cloudTitle');
 $('cloudUrl').disabled=!!cloudSession||cloudBusy;$('cloudKey').disabled=!!cloudSession||cloudBusy;
 for(const id of ['cloudLogin','cloudSignup','cloudSave','cloudLoad','cloudLogout'])$(id).disabled=cloudBusy;
}
function getCloudConfig(){
 const url=$('cloudUrl').value.trim().replace(/\/$/,''),key=$('cloudKey').value.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key)throw Error('cloudNotConfigured');
 let publicKey=key.startsWith('sb_publishable_');
 if(!publicKey){try{const payload=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));publicKey=payload.role==='anon'}catch{}}
 if(!publicKey)throw Error('cloudBadKey');
 return {url,key};
}
async function cloudRequest(path,options={}){
 const config=getCloudConfig();let response;
 try{response=await fetch(config.url+path,{...options,headers:{apikey:config.key,'Content-Type':'application/json',...(cloudSession?{Authorization:'Bearer '+cloudSession.access_token}:{}),...options.headers},signal:AbortSignal.timeout(20000)})}catch{throw Error('cloudNetwork')}
 let result;try{result=await response.json()}catch{throw Error('cloudNetwork')}
 if(!response.ok){
  if(String(result?.message||'').includes('CLOUD_CONFLICT'))throw Error('cloudConflict');
  if(path.startsWith('/auth/'))throw Error('cloudAuthError');
  if(response.status===401){cloudSession=null;cloudRevision=null;throw Error('cloudExpired')}
  throw Error('cloudSetupError');
 }
 return result;
}
async function withCloud(action){if(cloudBusy)return;cloudBusy=true;cloudUI();cloudMessage('cloudBusy');try{await action()}catch(e){cloudMessage(dict[state.lang][e.message]?e.message:'cloudNetwork',true)}finally{cloudBusy=false;cloudUI()}}
function requireCloud(){if(!cloudSession||cloudSession.expires_at<=Date.now()/1000){cloudSession=null;cloudRevision=null;throw Error('cloudExpired')}}
$('cloudButton').onclick=()=>{
 if(!$('cloudUrl').value){let config=CLOUD_DEFAULT;try{config=JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY))||CLOUD_DEFAULT}catch{}$('cloudUrl').value=config.url||'';$('cloudKey').value=config.key||'';}
 $('cloudConfig').open=!$('cloudUrl').value;cloudUI();$('cloudDialog').showModal();
};
$('closeCloud').onclick=()=>$('cloudDialog').close();
async function authenticate(signup){
 if(!$('cloudAuth').reportValidity())return;
 await withCloud(async()=>{
  const config=getCloudConfig();
  const result=await cloudRequest(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('cloudEmail').value.trim(),password:$('cloudPassword').value})});
  try{localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(config))}catch{}
  $('cloudPassword').value='';
  if(result.access_token&&result.user?.id){cloudSession={access_token:result.access_token,user:result.user,expires_at:result.expires_at||Date.now()/1000+(result.expires_in||3600)};cloudRevision=null;cloudMessage('cloudSignedIn')}
  else cloudMessage('cloudSignupDone');
 });
}
$('cloudAuth').onsubmit=e=>{e.preventDefault();authenticate(false)};
$('cloudSignup').onclick=()=>authenticate(true);
$('cloudSave').onclick=()=>withCloud(async()=>{
 requireCloud();if(loadFailed)throw Error('cloudLocalError');
 const snapshot=JSON.stringify(state);
 const revision=await cloudRequest('/rest/v1/rpc/save_personal_ledger',{method:'POST',body:JSON.stringify({p_data:JSON.parse(snapshot),p_expected:cloudRevision})});
 if(!Number.isSafeInteger(revision)||revision<1)throw Error('cloudSetupError');cloudRevision=revision;
 cloudMessage(JSON.stringify(state)===snapshot?'cloudSaved':'cloudChanged');
});
$('cloudLoad').onclick=()=>withCloud(async()=>{
 requireCloud();
 const rows=await cloudRequest('/rest/v1/personal_ledgers?select=data,revision&user_id=eq.'+encodeURIComponent(cloudSession.user.id),{method:'GET'});
 if(!Array.isArray(rows))throw Error('cloudReadError');
 if(!rows.length){cloudRevision=null;cloudMessage('cloudEmpty');return}
 let restored;try{restored=migrate(rows[0].data);if(!validState(restored)||!Number.isSafeInteger(rows[0].revision)||rows[0].revision<1)throw Error()}catch{throw Error('cloudReadError')}
 if(!confirm(t('cloudConfirm'))){cloudMessage('cloudSignedIn');return}
 state=restored;cloudRevision=rows[0].revision;loadFailed=false;persist();resetForm();render();cloudMessage('cloudLoaded');
 if(saveFailed)cloudMessage('storageError',true);
});
$('cloudLogout').onclick=()=>withCloud(async()=>{
 // Drop the in-memory session immediately, even if the logout request cannot reach the server.
 try{await cloudRequest('/auth/v1/logout',{method:'POST'})}catch{}
 cloudSession=null;cloudRevision=null;$('cloudPassword').value='';cloudMessage('cloudLoggedOut');
});
// Closing the dialog always removes any unsubmitted password.
$('cloudDialog').addEventListener('close',()=>{$('cloudPassword').value=''});

$('date').value=today();render();
</script></html>
